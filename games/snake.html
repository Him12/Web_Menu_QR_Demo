<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - TheVisuplate Game Arcade</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include controller CSS -->
    <link rel="stylesheet" href="../game-controller.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff5722;
            --light: #ffffff;
            --dark: #212529;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            width: 100%;
            padding: 20px 0;
        }

        .header-content {
            max-width: 1300px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--light);
        }

        .logo {
            font-size: 1.4rem;
            background: rgba(255, 255, 255, 0.25);
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: bold;
        }

        .brand-text h1 {
            font-size: 2.4rem;
            margin: 0;
        }

        .brand-text p {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-top: 3px;
        }

        .game-screen {
            position: relative;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #000;
            border-radius: 10px;
            max-width: 100%;
        }

        .game-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: var(--dark);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            min-width: 120px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 600px;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: var(--warning);
        }

        .instructions ul {
            text-align: left;
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .game-header h2 {
                font-size: 1.5rem;
            }

            .stats {
                justify-content: center;
            }

            canvas {
                width: 100% !important;
                height: auto !important;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
                font-size: 1rem;
            }

            .game-controls {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 12px;
                font-size: 1.1rem;
            }

            .instructions {
                width: 100%;
            }
        }
    </style>


</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="brand">
                    <a href="../index.html" class="brand-link">
                        <div class="logo">Home</div>
                        <div class="brand-text">
                            <h1>TheVisuplate Game Arcade</h1>
                            <p>Exciting Games - All in One Place!</p>
                        </div>
                    </a>
                </div>
            </div>
        </header>

        <div class="game-screen">
            <div class="game-header">
                <a href="games.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Menu</a>
                <h2>Snake Game</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">Score</div>
                        <div class="stat-value" id="snake-score">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Length</div>
                        <div class="stat-value" id="snake-length">3</div>
                    </div>
                </div>
            </div>
            <div class="game-content">
                <canvas id="snake-canvas" width="600" height="600"></canvas>
                <div class="game-controls">
                    <button class="btn btn-primary" id="snake-start">Start Game</button>
                    <button class="btn btn-warning" id="snake-restart">Restart</button>
                </div>
                <div class="instructions">
                    <h3>How to Play</h3>
                    <ul>
                        <li>Use arrow keys to control the snake</li>
                        <li>Eat the food to grow longer</li>
                        <li>Avoid hitting walls or yourself</li>
                        <li>Each food item gives you 10 points</li>
                    </ul>
                </div>
            </div>
        </div>

        <footer>
            <p>TheVisuplate Game Arcade &copy;</p>
        </footer>
    </div>
    <!-- Include controller JavaScript -->
    <script src="../game-controller.js"></script>
    <script>
        const canvas = document.getElementById('snake-canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('snake-start');
        const restartBtn = document.getElementById('snake-restart');
        const scoreDisplay = document.getElementById('snake-score');
        const lengthDisplay = document.getElementById('snake-length');

        let gameActive = false;
        let score = 0;
        let snake = [];
        let food = {};
        let direction = 'right';
        let gameSpeed = 100;
        let gameLoopId;

        let touchStartX = 0;
        let touchStartY = 0;

        function setupSnake() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / 20)),
                y: Math.floor(Math.random() * (canvas.height / 20))
            };

            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#4CAF50";
            for (let segment of snake) {
                ctx.fillRect(segment.x * 20, segment.y * 20, 18, 18);
            }

            ctx.fillStyle = "#FF5722";
            ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
        }

        function update() {
            const head = { x: snake[0].x, y: snake[0].y };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            if (head.x < 0 || head.x >= canvas.width / 20 ||
                head.y < 0 || head.y >= canvas.height / 20) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop();
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            gameLoopId = setTimeout(gameLoop, gameSpeed);
        }

        function startGame() {
            if (gameActive) return;

            gameActive = true;
            score = 0;
            setupSnake();
            generateFood();
            updateScore();
            gameLoop();
            // Enable controller for this game
            enableController();
            document.addEventListener('keydown', handleKeyPress);
            canvas.addEventListener("touchstart", handleTouchStart);
            canvas.addEventListener("touchend", handleTouchEnd);
        }
        function enableController() {
            // Listen for controller events
            window.addEventListener('gameControl', handleControllerInput);

            // Enable all arrow buttons
            if (window.gameController) {
                window.gameController.setButtonState('up', true);
                window.gameController.setButtonState('down', true);
                window.gameController.setButtonState('left', true);
                window.gameController.setButtonState('right', true);
                window.gameController.setButtonState('actionA', true);
                window.gameController.setButtonState('actionB', true);
            }
        }

        function disableController() {
            window.removeEventListener('gameControl', handleControllerInput);
        }

        function handleControllerInput(event) {
            if (!gameActive) return;

            const action = event.detail.action;

            switch (action) {
                case 'up':
                    if (direction !== 'down') direction = 'up';
                    break;
                case 'down':
                    if (direction !== 'up') direction = 'down';
                    break;
                case 'left':
                    if (direction !== 'right') direction = 'left';
                    break;
                case 'right':
                    if (direction !== 'left') direction = 'right';
                    break;
                case 'actionA':
                    // Speed boost or special action
                    break;
                case 'actionB':
                    // Pause or other action
                    break;
            }
        }
        function handleKeyPress(e) {
            if (!gameActive) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') direction = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') direction = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') direction = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') direction = 'right';
                    break;
            }
        }

        function handleTouchStart(e) {
            const touch = e.changedTouches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function handleTouchEnd(e) {
            const touch = e.changedTouches[0];
            let dx = touch.clientX - touchStartX;
            let dy = touch.clientY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction !== 'left') direction = 'right';
                else if (dx < 0 && direction !== 'right') direction = 'left';
            } else {
                if (dy > 0 && direction !== 'up') direction = 'down';
                else if (dy < 0 && direction !== 'down') direction = 'up';
            }
        }

        function updateScore() {
            scoreDisplay.textContent = score;
            lengthDisplay.textContent = snake.length;
        }

        function gameOver() {
            gameActive = false;
            clearTimeout(gameLoopId);

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 50);

            ctx.font = "24px Arial";
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2);
            ctx.fillText(`Snake Length: ${snake.length}`, canvas.width / 2, canvas.height / 2 + 40);

            document.removeEventListener('keydown', handleKeyPress);
            canvas.removeEventListener("touchstart", handleTouchStart);
            canvas.removeEventListener("touchend", handleTouchEnd);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        setupSnake();
        generateFood();
        draw();
        updateScore();
        // Add keyboard controls
        document.addEventListener('keydown', handleKeyPress);
    </script>
</body>

</html>
