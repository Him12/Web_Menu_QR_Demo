<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - TheVisuplate Game Arcade</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff5722;
            --light: #ffffff;
            --dark: #212529;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            width: 100%;
            padding: 20px 0;
        }

        .header-content {
            max-width: 1300px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--light);
        }

        .logo {
            font-size: 1.4rem;
            background: rgba(255, 255, 255, 0.25);
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: bold;
        }

        .brand-text h1 {
            font-size: 2.4rem;
            margin: 0;
        }

        .brand-text p {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-top: 3px;
        }

        .game-screen {
            position: relative;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rps-choices {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .rps-choice {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            background: var(--primary);
            transition: transform 0.2s;
        }

        .rps-choice:hover {
            transform: scale(1.1);
        }

        .rps-result {
            font-size: 1.5rem;
            margin: 20px 0;
            text-align: center;
        }

        .game-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            min-width: 120px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 600px;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: var(--warning);
        }

        .instructions ul {
            text-align: left;
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .game-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .game-header h2 {
                font-size: 1.5rem;
            }

            .stats {
                justify-content: center;
            }

            .rps-choices {
                flex-direction: column;
                align-items: center;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
                font-size: 1rem;
            }

            .game-controls {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 12px;
                font-size: 1.1rem;
            }

            .instructions {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="brand">
                    <a href="../index.html" class="brand-link">
                        <div class="logo">Home</div>
                        <div class="brand-text">
                            <h1>TheVisuplate Game Arcade</h1>
                            <p>Exciting Games - All in One Place!</p>
                        </div>
                    </a>
                </div>
            </div>
        </header>

        <div class="game-screen">
            <div class="game-header">
                <a href="games.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Menu</a>
                <h2>Rock Paper Scissors</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">Wins</div>
                        <div class="stat-value" id="rps-wins">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Losses</div>
                        <div class="stat-value" id="rps-losses">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Draws</div>
                        <div class="stat-value" id="rps-draws">0</div>
                    </div>
                </div>
            </div>
            <div class="game-content">
                <div class="rps-choices">
                    <div class="rps-choice" data-choice="rock">
                        <i class="fas fa-hand-rock"></i>
                    </div>
                    <div class="rps-choice" data-choice="paper">
                        <i class="fas fa-hand-paper"></i>
                    </div>
                    <div class="rps-choice" data-choice="scissors">
                        <i class="fas fa-hand-scissors"></i>
                    </div>
                </div>
                <div class="rps-result" id="rps-result">Make your choice!</div>
                <div class="game-controls">
                    <button class="btn btn-primary" id="rps-reset">Reset Score</button>
                </div>
                <div class="instructions">
                    <h3>How to Play</h3>
                    <ul>
                        <li>Choose Rock, Paper, or Scissors</li>
                        <li>Rock beats Scissors</li>
                        <li>Scissors beats Paper</li>
                        <li>Paper beats Rock</li>
                    </ul>
                </div>
            </div>
        </div>

        <footer>
            <p>TheVisuplate Game Arcade &copy;</p>
        </footer>
    </div>

    <script>
        const choices = document.querySelectorAll('.rps-choice');
        const resultDisplay = document.getElementById('rps-result');
        const resetBtn = document.getElementById('rps-reset');
        const winsDisplay = document.getElementById('rps-wins');
        const lossesDisplay = document.getElementById('rps-losses');
        const drawsDisplay = document.getElementById('rps-draws');

        let wins = 0;
        let losses = 0;
        let draws = 0;

        function computerChoice() {
            const choices = ['rock', 'paper', 'scissors'];
            return choices[Math.floor(Math.random() * choices.length)];
        }

        function determineWinner(player, computer) {
            if (player === computer) return 'draw';

            if (
                (player === 'rock' && computer === 'scissors') ||
                (player === 'paper' && computer === 'rock') ||
                (player === 'scissors' && computer === 'paper')
            ) {
                return 'player';
            }

            return 'computer';
        }

        function handleChoice(e) {
            const playerChoice = e.currentTarget.dataset.choice;
            const computer = computerChoice();
            const winner = determineWinner(playerChoice, computer);

            if (winner === 'player') {
                resultDisplay.textContent = `You win! ${playerChoice} beats ${computer}`;
                wins++;
                winsDisplay.textContent = wins;
            } else if (winner === 'computer') {
                resultDisplay.textContent = `You lose! ${computer} beats ${playerChoice}`;
                losses++;
                lossesDisplay.textContent = losses;
            } else {
                resultDisplay.textContent = `It's a draw! Both chose ${playerChoice}`;
                draws++;
                drawsDisplay.textContent = draws;
            }
        }

        function resetScore() {
            wins = 0;
            losses = 0;
            draws = 0;
            winsDisplay.textContent = wins;
            lossesDisplay.textContent = losses;
            drawsDisplay.textContent = draws;
            resultDisplay.textContent = 'Make your choice!';
        }

        choices.forEach(choice => {
            choice.addEventListener('click', handleChoice);
        });

        resetBtn.addEventListener('click', resetScore);
    </script>
</body>
</html>
